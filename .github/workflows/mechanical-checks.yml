name: Mechanical Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mechanical:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Build release CLI
        run: cargo build --release -p infra-cli

      - name: Check final assignments on persistent Boxes
        env:
          RAYON_NUM_THREADS: 2
        run: python3 scripts/assert_rotation_invariants.py --binary target/release/infra-cli --skip-build --group all --jobs 2 --output-dir target/codex-runs/ci-invariants

      - name: Check stable Markdown and CLI facts
        run: python3 scripts/codex/check_repository_facts.py

      - name: Check Agent documentation indexes
        run: python3 scripts/codex/generate_agent_index.py --check

      - name: Check documentation lifecycle
        run: python3 scripts/codex/docs_inventory.py --check
