[package]
name = "infra-cli"
version = "0.1.0"
edition.workspace = true
build = "build.rs"

[[bin]]
name = "infra-cli"
path = "src/main.rs"

[dependencies]
infra-core = { path = "../infra-core" }
serde.workspace = true
serde_json.workspace = true
csv.workspace = true
jsonschema = { version = "0.18", default-features = false, features = ["draft202012"] }
sha2 = "0.10"
