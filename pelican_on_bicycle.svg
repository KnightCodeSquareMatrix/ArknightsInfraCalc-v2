<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">鹈鹕骑单车</title>
  <desc id="desc">一只戴着小帽子的鹈鹕，迎着海风骑着复古单车穿过海边小路。</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9c7"/>
      <stop offset="0.56" stop-color="#c5e8e4"/>
      <stop offset="1" stop-color="#93c9ce"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6eafb8"/>
      <stop offset="1" stop-color="#397d8f"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efc6a2"/>
      <stop offset="1" stop-color="#d58e78"/>
    </linearGradient>
    <linearGradient id="feather" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fffdf4"/>
      <stop offset="0.72" stop-color="#f5eee0"/>
      <stop offset="1" stop-color="#dfd3c2"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef0eb"/>
      <stop offset="0.65" stop-color="#c5d0cf"/>
      <stop offset="1" stop-color="#91adb2"/>
    </linearGradient>
    <linearGradient id="bill" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.5" stop-color="#f5a45d"/>
      <stop offset="1" stop-color="#db7655"/>
    </linearGradient>
    <linearGradient id="bikePaint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ef725d"/>
      <stop offset="1" stop-color="#b84055"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e7186"/>
      <stop offset="1" stop-color="#17465d"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#214b57" flood-opacity="0.22"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#214b57" flood-opacity="0.22"/>
    </filter>
    <pattern id="tireTexture" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="12" height="12" fill="#172f3d"/>
      <path d="M0 0L0 12" stroke="#294755" stroke-width="3"/>
    </pattern>
  </defs>

  <!-- 海边黄昏背景 -->
  <rect width="1200" height="800" rx="36" fill="url(#sky)"/>
  <circle cx="954" cy="153" r="74" fill="#fff3c5" opacity="0.86"/>
  <circle cx="954" cy="153" r="101" fill="#fff3c5" opacity="0.15"/>
  <path d="M-30 212 C115 168 160 238 275 208 C382 180 432 215 528 201 C650 184 711 236 825 212 C948 185 1072 203 1230 168 L1230 346 L-30 346Z" fill="#b1d8d4" opacity="0.7"/>
  <path d="M-30 268 C130 225 220 294 347 262 C486 227 571 289 696 258 C837 223 916 280 1045 247 C1127 226 1183 242 1230 229 L1230 396 L-30 396Z" fill="#7bb5bb" opacity="0.63"/>
  <path d="M0 354 C170 334 291 374 440 351 C604 327 694 370 848 344 C997 318 1102 363 1200 335 L1200 545 L0 545Z" fill="url(#sea)"/>
  <path d="M0 408 C166 384 274 429 427 405 C593 379 708 425 858 397 C1001 370 1108 412 1200 388" fill="none" stroke="#b7e4df" stroke-width="8" opacity="0.48"/>
  <path d="M0 460 C142 440 260 472 408 451 C550 431 700 475 848 447 C1011 418 1094 456 1200 439" fill="none" stroke="#b7e4df" stroke-width="5" opacity="0.3"/>
  <path d="M0 502 C196 477 289 517 451 494 C622 469 715 515 879 484 C1023 458 1105 491 1200 477 L1200 800 L0 800Z" fill="url(#road)"/>
  <path d="M0 576 C192 549 338 597 502 566 C671 535 831 584 996 553 C1081 537 1152 548 1200 539" fill="none" stroke="#f7d8ac" stroke-width="8" opacity="0.68"/>
  <path d="M92 701 L196 687 M320 668 L416 657 M935 641 L1017 636 M1080 626 L1142 623" stroke="#f8d9ae" stroke-width="10" stroke-linecap="round" opacity="0.75"/>
  <!-- 云 -->
  <g fill="#fffdf4" opacity="0.72">
    <path d="M107 137 C107 113 130 94 158 94 C178 94 195 105 202 122 C209 111 225 104 242 104 C271 104 294 126 294 153 L294 163 L107 163Z"/>
    <path d="M396 93 C396 74 414 59 436 59 C453 59 466 68 472 81 C481 70 494 65 510 65 C534 65 553 83 553 106 L553 113 L396 113Z" opacity="0.6"/>
  </g>
  <!-- 远处海草 -->
  <g fill="none" stroke="#2c7880" stroke-width="7" stroke-linecap="round" opacity="0.72">
    <path d="M82 524 C76 487 90 463 98 439 M98 524 C111 486 127 476 137 451 M119 524 C119 489 111 470 105 454"/>
    <path d="M1097 524 C1094 487 1106 462 1117 439 M1114 524 C1125 490 1144 476 1158 457 M1134 524 C1134 488 1127 471 1122 454"/>
  </g>

  <!-- 自行车投影 -->
  <ellipse cx="615" cy="696" rx="348" ry="25" fill="#244b56" opacity="0.2"/>

  <!-- 自行车 -->
  <g id="bicycle" filter="url(#smallShadow)">
    <!-- 轮胎与轮圈 -->
    <g>
      <circle cx="383" cy="570" r="126" fill="none" stroke="#132e3c" stroke-width="20"/>
      <circle cx="383" cy="570" r="117" fill="none" stroke="url(#tireTexture)" stroke-width="4" opacity="0.95"/>
      <circle cx="383" cy="570" r="108" fill="none" stroke="#d8e3dc" stroke-width="4"/>
      <circle cx="836" cy="570" r="126" fill="none" stroke="#132e3c" stroke-width="20"/>
      <circle cx="836" cy="570" r="117" fill="none" stroke="url(#tireTexture)" stroke-width="4" opacity="0.95"/>
      <circle cx="836" cy="570" r="108" fill="none" stroke="#d8e3dc" stroke-width="4"/>
      <g stroke="#dce8df" stroke-width="2" opacity="0.8">
        <path d="M383 462V678 M275 570H491 M307 494L459 646 M307 646L459 494"/>
        <path d="M836 462V678 M728 570H944 M760 494L912 646 M760 646L912 494"/>
      </g>
      <circle cx="383" cy="570" r="12" fill="#f8c36b" stroke="#173746" stroke-width="6"/>
      <circle cx="836" cy="570" r="12" fill="#f8c36b" stroke="#173746" stroke-width="6"/>
    </g>
    <!-- 车架 -->
    <g fill="none" stroke="#173746" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
      <path d="M383 570 L520 414 L650 570 L383 570 M520 414 L836 570 L650 570"/>
      <path d="M650 570 L736 411 L836 570"/>
      <path d="M736 411 L780 374"/>
      <path d="M780 374 L818 379"/>
    </g>
    <g fill="none" stroke="url(#bikePaint)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M383 570 L520 414 L650 570 L383 570 M520 414 L836 570"/>
      <path d="M650 570 L736 411"/>
    </g>
    <!-- 坐垫和车把 -->
    <path d="M486 408 C508 395 539 396 558 406 L556 422 C531 429 504 426 485 417Z" fill="#173746"/>
    <path d="M483 407 C504 397 538 399 557 408" fill="none" stroke="#f7b565" stroke-width="5" stroke-linecap="round"/>
    <path d="M735 411 C751 396 764 382 781 373 C796 366 818 369 832 377" fill="none" stroke="#173746" stroke-width="12" stroke-linecap="round"/>
    <path d="M801 369 C816 363 831 367 838 377" fill="none" stroke="#ef725d" stroke-width="7" stroke-linecap="round"/>
    <!-- 脚踏 -->
    <circle cx="650" cy="570" r="31" fill="none" stroke="#173746" stroke-width="8"/>
    <circle cx="650" cy="570" r="9" fill="#f6b65f" stroke="#173746" stroke-width="4"/>
    <path d="M650 570 L681 591 M650 570 L620 548" stroke="#173746" stroke-width="7" stroke-linecap="round"/>
    <path d="M675 588 L706 590 M616 545 L586 544" stroke="#173746" stroke-width="8" stroke-linecap="round"/>
    <!-- 前篮 -->
    <path d="M795 420 L894 421 L878 493 L810 493Z" fill="#eaa26e" stroke="#173746" stroke-width="7" stroke-linejoin="round"/>
    <path d="M802 438H887 M807 458H883 M812 478H879 M826 423L835 491 M850 423L855 491 M874 423L874 491" fill="none" stroke="#f8d29b" stroke-width="4" opacity="0.9"/>
    <path d="M811 421 C812 393 831 380 850 381 C870 381 887 396 888 421" fill="none" stroke="#173746" stroke-width="7"/>
  </g>

  <!-- 鹈鹕的尾羽 -->
  <g filter="url(#shadow)">
    <path d="M497 348 C453 327 416 333 386 361 C423 363 444 377 462 400 C428 393 402 405 382 432 C432 436 468 425 509 397Z" fill="#d7e1de" stroke="#173746" stroke-width="8" stroke-linejoin="round"/>
    <path d="M462 354 C432 352 412 361 398 376 M470 374 C437 375 418 390 405 408 M476 393 C448 398 430 414 419 426" fill="none" stroke="#a0b9ba" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- 鹈鹕身体 -->
  <g filter="url(#shadow)">
    <ellipse cx="590" cy="363" rx="137" ry="170" transform="rotate(-9 590 363)" fill="url(#feather)" stroke="#173746" stroke-width="9"/>
    <!-- 胸前柔软的羽毛 -->
    <path d="M522 279 C492 321 495 394 536 454 C554 479 582 495 609 500 C581 444 588 397 604 353 C617 316 600 285 574 266Z" fill="#fffdf6" opacity="0.82"/>
    <!-- 翼 -->
    <path d="M523 281 C567 255 652 271 704 327 C720 344 731 364 735 388 C704 429 640 469 577 456 C531 446 500 407 496 359 C494 328 502 299 523 281Z" fill="url(#wing)" stroke="#173746" stroke-width="9"/>
    <path d="M532 314 C581 302 643 324 690 363" fill="none" stroke="#a1b9bb" stroke-width="10" stroke-linecap="round"/>
    <path d="M520 349 C569 343 630 361 675 395 M527 389 C566 389 610 403 646 423" fill="none" stroke="#a1b9bb" stroke-width="8" stroke-linecap="round" opacity="0.95"/>
    <path d="M532 416 C558 422 585 433 606 445" fill="none" stroke="#829fa7" stroke-width="7" stroke-linecap="round"/>
    <!-- 颈部 -->
    <path d="M628 299 C638 262 654 226 682 200 C705 178 740 184 756 212 C770 238 755 269 735 291 C716 311 707 333 710 360 L644 358Z" fill="url(#feather)" stroke="#173746" stroke-width="9"/>
    <path d="M654 285 C683 267 714 262 741 271" fill="none" stroke="#d8d3c7" stroke-width="7" stroke-linecap="round"/>
    <!-- 头部 -->
    <ellipse cx="718" cy="184" rx="78" ry="68" transform="rotate(-8 718 184)" fill="url(#feather)" stroke="#173746" stroke-width="9"/>
    <path d="M672 142 C693 112 746 107 780 133 C793 143 800 158 803 171 C767 153 728 151 690 165Z" fill="url(#cap)" stroke="#173746" stroke-width="8" stroke-linejoin="round"/>
    <path d="M675 163 C707 153 752 157 785 177 C765 180 741 182 715 181 C698 180 684 175 675 163Z" fill="#ee725f" stroke="#173746" stroke-width="6"/>
    <path d="M686 136 C695 126 704 120 716 117" fill="none" stroke="#70b6bc" stroke-width="6" stroke-linecap="round"/>
    <!-- 眼睛和脸颊 -->
    <ellipse cx="747" cy="182" rx="16" ry="19" fill="#173746"/>
    <circle cx="752" cy="175" r="5" fill="#fffdf4"/>
    <path d="M724 210 C739 221 755 223 770 216" fill="none" stroke="#d7aa9a" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <!-- 鹈鹕喙与喉囊 -->
    <path d="M774 178 C840 170 936 184 1032 222 C982 246 895 249 803 226 C786 216 777 197 774 178Z" fill="url(#bill)" stroke="#173746" stroke-width="9" stroke-linejoin="round"/>
    <path d="M801 226 C874 247 955 244 1032 222 C1009 283 967 327 914 339 C873 349 832 326 814 293 C801 270 797 246 801 226Z" fill="#ef9b69" stroke="#173746" stroke-width="9" stroke-linejoin="round"/>
    <path d="M812 236 C861 253 930 253 1000 234" fill="none" stroke="#f8c07c" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
    <path d="M831 291 C863 308 898 315 931 311" fill="none" stroke="#d97861" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
    <path d="M814 226 C855 230 890 229 926 224" fill="none" stroke="#b95f55" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <!-- 腿与蹼 -->
    <path d="M574 493 C574 520 567 543 553 561 M641 493 C646 519 657 542 674 562" fill="none" stroke="#e48d4e" stroke-width="13" stroke-linecap="round"/>
    <path d="M548 558 C532 566 516 569 501 568 M551 559 C540 573 528 581 514 585 M675 560 C690 567 705 569 720 567 M674 561 C686 574 698 582 712 585" fill="none" stroke="#e48d4e" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- 飘动围巾，增加速度感 -->
  <g filter="url(#smallShadow)">
    <path d="M648 264 C624 277 602 286 576 282 C557 279 544 269 531 252 C565 266 590 264 619 246Z" fill="#ef725d" stroke="#173746" stroke-width="7" stroke-linejoin="round"/>
    <path d="M582 279 C557 298 533 311 505 310 C484 309 466 301 450 286 C486 296 516 285 545 266Z" fill="#f6ae68" stroke="#173746" stroke-width="7" stroke-linejoin="round"/>
  </g>

  <!-- 前景小花 -->
  <g opacity="0.72">
    <path d="M103 713 C111 682 117 663 122 641 M122 680 C106 666 96 655 90 642 M119 660 C134 650 143 639 149 627" fill="none" stroke="#4b8b6c" stroke-width="6" stroke-linecap="round"/>
    <circle cx="88" cy="639" r="8" fill="#f7c26b"/><circle cx="149" cy="624" r="8" fill="#ef725d"/>
    <path d="M1091 704 C1098 676 1104 660 1112 640 M1110 677 C1097 665 1089 654 1085 642 M1110 658 C1126 647 1134 636 1140 624" fill="none" stroke="#4b8b6c" stroke-width="6" stroke-linecap="round"/>
    <circle cx="1084" cy="639" r="8" fill="#f7c26b"/><circle cx="1141" cy="621" r="8" fill="#ef725d"/>
  </g>

  <!-- 装饰文字 -->
  <g fill="#173746" opacity="0.78">
    <text x="78" y="90" font-family="Georgia, serif" font-size="18" letter-spacing="4">SEASIDE RIDE</text>
    <text x="1053" y="742" font-family="Georgia, serif" font-size="16" letter-spacing="3" text-anchor="end">PEDAL &amp; PLUME</text>
  </g>
</svg>
